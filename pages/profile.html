<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя - TAUsers</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <div class="logo">
                    <h1>TAUsers</h1>
                </div>
                <ul class="nav-menu">
                    <li><a href="../index.html">Главная</a></li>
                    <li><a href="profile.html" class="active">Профиль</a></li>
                    <li><a href="requests.html">Заявки</a></li>
                    <li><a href="about.html">О проекте</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <section class="content-section">
                <h2>Профиль пользователя</h2>
                
                <div id="profile-info">
                    <div class="profile-header">
                        <div class="profile-avatar">👤</div>
                        <div class="profile-details">
                            <h3 id="profile-name">Загрузка...</h3>
                            <p id="profile-email"></p>
                        </div>
                    </div>
                    
                    <form id="profile-form">
                        <div class="form-group">
                            <label for="user-name">Имя пользователя</label>
                            <input type="text" id="user-name" name="name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="user-email">Email</label>
                            <input type="email" id="user-email" name="email" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="user-phone">Телефон</label>
                            <input type="tel" id="user-phone" name="phone">
                        </div>
                        
                        <div class="form-group">
                            <label for="user-about">О себе</label>
                            <textarea id="user-about" name="about"></textarea>
                        </div>
                        
                        <button type="submit" class="btn-primary">Сохранить изменения</button>
                    </form>
                </div>
            </section>
            
            <section class="content-section">
                <h2>Статистика</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="stat-requests">0</div>
                        <div class="stat-label">Всего заявок</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-active">0</div>
                        <div class="stat-label">Активных заявок</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-completed">0</div>
                        <div class="stat-label">Завершенных</div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 TAUsers - Приложения для tashi-ani.ru</p>
            <p>
                <a href="https://github.com/DGersmv/TAUsers" target="_blank">GitHub</a> |
                <a href="https://github.com/DGersmv/TAOnline" target="_blank">TAOnline</a>
            </p>
        </div>
    </footer>

    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadProfile();
            loadStats();
            
            document.getElementById('profile-form').addEventListener('submit', function(e) {
                e.preventDefault();
                saveProfile();
            });
        });
        
        function loadProfile() {
            const user = TAUsers.getCurrentUser();
            if (user) {
                document.getElementById('profile-name').textContent = user.name;
                document.getElementById('profile-email').textContent = user.email;
                document.getElementById('user-name').value = user.name;
                document.getElementById('user-email').value = user.email;
                document.getElementById('user-phone').value = user.phone || '';
                document.getElementById('user-about').value = user.about || '';
            }
        }
        
        function saveProfile() {
            const formData = {
                name: document.getElementById('user-name').value,
                email: document.getElementById('user-email').value,
                phone: document.getElementById('user-phone').value,
                about: document.getElementById('user-about').value
            };
            
            const user = TAUsers.getCurrentUser();
            const updatedUser = { ...user, ...formData };
            
            if (TAUsers.updateUserProfile(updatedUser)) {
                TAUsers.showNotification('Профиль успешно обновлен', 'success');
                loadProfile();
            } else {
                TAUsers.showNotification('Ошибка при сохранении профиля', 'error');
            }
        }
        
        function loadStats() {
            const requests = TAUsers.requestsDB.get();
            document.getElementById('stat-requests').textContent = requests.length;
            
            const active = requests.filter(r => r.status === 'new' || r.status === 'processing').length;
            document.getElementById('stat-active').textContent = active;
            
            const completed = requests.filter(r => r.status === 'completed').length;
            document.getElementById('stat-completed').textContent = completed;
        }
    </script>
    
    <style>
        .profile-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #ddd;
        }
        
        .profile-avatar {
            font-size: 4rem;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
        }
        
        .profile-details h3 {
            margin: 0;
            color: #2c3e50;
        }
        
        .profile-details p {
            margin: 0.5rem 0 0 0;
            color: #666;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
        }
        
        .stat-card {
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        
        .stat-label {
            font-size: 1rem;
            opacity: 0.9;
        }
    </style>
</body>
</html>
